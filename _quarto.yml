project:
  type: website
  output-dir: docs          # GitHub Pages: Settings > Pages > Deploy from branch > /docs
  resources:
    - "assets/**"           # copy all PDFs/images to the built site, even ones no page links yet

website:
  title: "OCN 623 – Chemical Oceanography"
  site-url: https://sethbushinsky.github.io/OCN623_Chemical_Oceanography
  description: "Slides, recordings, and supplementary materials for OCN 623 - Chemical Oceanography at the University of Hawaiʻi at Mānoa"
  # logo: assets/images/Logo_Mark_Backed.png
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Course Content
        menu:
          - 01-ocean-chemistry-fundamentals.qmd
          - 02-chemical-signature-life.qmd
          - 03-thermodynamics.qmd
          - 04-global-impacts.qmd
          - 05-ocean-tracers.qmd
      - problem-sets.qmd
      - handouts.qmd
  page-footer:
    left: "© Seth Bushinsky"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    html-math-method: mathjax
